{{- /* 글 목록 한 줄. 인자: dict "page" 글 "summary" 요약 표시 여부 */ -}}
{{- $p := .page }}
<a class="row" href="{{ $p.RelPermalink }}">
  <span class="row-main">
    <span class="row-title">{{ $p.Title }}</span>
    {{- if $p.Draft }}<span class="row-state">초안</span>{{ end }}
    {{- if .summary }}{{ with $p.Summary }}<span class="row-sum">{{ . | plainify | htmlUnescape | truncate 120 }}</span>{{ end }}{{ end }}
  </span>
  <time datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006.01.02" }}</time>
</a>
