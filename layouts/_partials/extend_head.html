{{- /* 글꼴: 본문 Wanted Sans(한글 포함), 코드 JetBrains Mono. 아이콘: Phosphor */ -}}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">

{{- /* 연재 목차를 접어 둔 상태를 화면이 그려지기 전에 적용 */ -}}
<script>try { if (localStorage.getItem("rail-series") === "off") document.documentElement.dataset.rail = "off"; } catch (e) {}</script>

{{- /* 글 안에 mermaid 코드 블록이 있을 때만 Mermaid 스크립트를 불러옵니다 */ -}}
{{- if and .IsPage (strings.Contains .RawContent "```mermaid") }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = document.documentElement.dataset.theme === "dark";
  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    fontFamily: "Wanted Sans Variable, sans-serif",
    themeVariables: dark
      ? { background: "transparent", primaryColor: "#1b1c20", primaryTextColor: "#ececee", primaryBorderColor: "#4a4b52", lineColor: "#9d9ea5", textColor: "#ececee", fontSize: "15px" }
      : { background: "transparent", primaryColor: "#f2f2f0", primaryTextColor: "#151516", primaryBorderColor: "#c9c9c5", lineColor: "#55565c", textColor: "#151516", fontSize: "15px" }
  });
</script>
{{- end }}
