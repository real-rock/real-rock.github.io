{{- /* 글꼴: 본문 Pretendard, 코드 JetBrains Mono */ -}}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">

{{- /* 글 안에 mermaid 코드 블록이 있을 때만 Mermaid 스크립트를 불러옵니다 */ -}}
{{- if and .IsPage (strings.Contains .RawContent "```mermaid") }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = document.documentElement.dataset.theme === "dark";
  mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "neutral", fontFamily: "Pretendard Variable, sans-serif" });
</script>
{{- end }}
