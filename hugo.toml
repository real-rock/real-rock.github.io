baseURL = "https://jinlog.dev/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true
title = "Jin's 블로그"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON은 블로그 내 검색용

[params]
  author = "Jin"
  description = "MongoDB·PostgreSQL DBA Jin이 데이터베이스에 관한 이야기를 기록하는 블로그"
  defaultTheme = "dark"      # 기본 다크, 헤더 버튼으로 라이트 전환
  ShowCodeCopyButtons = true
  profile = "MongoDB와 PostgreSQL을 다루는 DBA"   # 홈 사이드바 프로필 한 줄

  # 파비콘: static/ 아래 파일. 원본은 favicon.svg(JetBrains Mono J + 강조색 커서)
  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#101113"
    msapplication_TileColor = "#101113"

  [params.homeInfoParams]
    Title = "Jin's 블로그"
    Content = "MongoDB와 PostgreSQL을 다루는 DBA입니다. DB를 운영하며 배우고 궁금했던 것들을 이곳에 정리합니다."

  [params.fuseOpts]
    keys = ["title", "summary", "content"]

[[menu.main]]
  name = "글"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "시리즈"
  url = "/series/"
  weight = 20
[[menu.main]]
  name = "태그"
  url = "/tags/"
  weight = 30
[[menu.main]]
  name = "소개"
  url = "/about/"
  weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false   # 색은 assets/css/extended/custom.css의 .chroma 규칙에서 지정
    lineNos = false
