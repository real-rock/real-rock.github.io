baseURL = "https://jinlog.dev/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true
title = "Jin's 블로그"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON은 블로그 내 검색용

[params]
  author = "Jin"
  description = "Jin이 일하고 공부하면서 배운 것을 기록하는 개인 블로그"
  defaultTheme = "dark"      # 기본 다크, 헤더 버튼으로 라이트 전환
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "Jin's 블로그"
    Content = "일하면서 배우고 궁금했던 것들을 정리해 둡니다. 지금은 PostgreSQL과 MongoDB의 내부 구조를 연재하고 있습니다."

  [params.fuseOpts]
    keys = ["title", "summary", "content"]

[[menu.main]]
  name = "글"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "시리즈"
  url = "/series/"
  weight = 20
[[menu.main]]
  name = "태그"
  url = "/tags/"
  weight = 30
[[menu.main]]
  name = "소개"
  url = "/about/"
  weight = 50

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false   # 색은 assets/css/extended/custom.css의 .chroma 규칙에서 지정
    lineNos = false
